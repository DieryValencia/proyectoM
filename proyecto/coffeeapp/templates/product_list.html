<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Para responsividad -->
    <title>Lista de Productos - Café App</title>
    {% load static %} <!-- Cargar archivos estáticos -->
    <!-- Bootstrap CSS para estilos base atractivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container"> <!-- Contenedor principal -->
        <h1>Productos de Café Disponibles</h1>
        <!-- Formulario de búsqueda -->
        <form method="get" class="mb-4"> <!-- Formulario GET para búsqueda -->
            <div class="input-group"> <!-- Grupo de input para Bootstrap -->
                <input type="text" name="q" class="form-control" placeholder="Buscar productos..." value="{{ query }}"> <!-- Campo de texto con valor actual -->
                <button class="btn btn-outline-secondary" type="submit">Buscar</button> <!-- Botón de búsqueda -->
            </div>
        </form>
        {% if productos %} <!-- Si hay productos -->
            <ul class="product-list"> <!-- Lista de productos con grid -->
                {% for producto in productos %}
                    <li class="product-item"> <!-- Elemento de producto con estilos -->
                        <a href="{% url 'product_detail' producto.id %}">{{ producto.nombre }}</a>
                        <div class="price">${{ producto.precio }}</div> <!-- Precio separado -->
                    </li>
                {% endfor %}
            </ul>
        {% else %} <!-- Si no hay productos -->
            <p class="text-center">No se encontraron productos. {% if query %}Intenta con otra búsqueda.{% endif %}</p> <!-- Mensaje si no hay resultados -->
        {% endif %}
    </div>
    <!-- Bootstrap JS para funcionalidades interactivas -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS personalizado -->
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
